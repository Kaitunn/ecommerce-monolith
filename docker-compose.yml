services:
  postgres:
    image: postgres:17
    container_name: ecommerce-postgres-compose

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: ecommerce_db

    volumes:
      - ecommerce_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ecommerce_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .

    container_name: ecommerce-api

    environment:
      DATABASE_URL: postgresql://admin:123456@postgres:5432/ecommerce_db?schema=public
      PORT: 4000
      JWT_SECRET: ecommerce_mvp_secret_2026
      JWT_EXPIRES_IN: 1d

    ports:
      - "4000:4000"

    depends_on:
      postgres:
        condition: service_healthy

    command: >
      sh -c "npx prisma migrate deploy &&
             npm run seed &&
             npm start"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  ecommerce_pgdata: